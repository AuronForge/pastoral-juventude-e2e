name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - release
  workflow_dispatch:
    inputs:
      frontend_base_url:
        description: URL pública ou interna do frontend
        required: true
        type: string
      backend_base_url:
        description: URL pública ou interna do backend
        required: true
        type: string
      auth_live:
        description: Executar autenticação real com massa regressiva preparada
        type: boolean
        default: false
      auth_environment:
        description: Ambiente da massa regressiva
        type: choice
        default: desenvolvimento
        options: [desenvolvimento, homologacao]
  workflow_call:
    inputs:
      frontend_base_url:
        required: true
        type: string
      backend_base_url:
        required: true
        type: string
      auth_live:
        type: boolean
        default: false
      auth_environment:
        type: string
        default: desenvolvimento
    secrets:
      E2E_NORMAL_EMAIL:
        required: false
      E2E_NORMAL_PASSWORD:
        required: false
      E2E_REQUIRED_CHANGE_EMAIL:
        required: false
      E2E_TEMPORARY_PASSWORD:
        required: false
      E2E_FINAL_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.8.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

  container:
    name: E2E container runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build runner image and verify Chromium as non-root
        run: |
          docker build --tag pastoral-e2e:ci .
          docker run --rm --user 1001:1001 -e HOME=/tmp --entrypoint node pastoral-e2e:ci -e "const {chromium}=require('@playwright/test'); (async()=>{const browser=await chromium.launch(); await browser.close();})().catch(error=>{console.error(error); process.exit(1);});"

  e2e:
    name: End-to-End tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_FRONTEND_BASE_URL: ${{ inputs.frontend_base_url }}
      E2E_BACKEND_BASE_URL: ${{ inputs.backend_base_url }}
      E2E_AUTH_LIVE: ${{ inputs.auth_live }}
      E2E_ENVIRONMENT: ${{ inputs.auth_environment }}
      E2E_NORMAL_EMAIL: ${{ secrets.E2E_NORMAL_EMAIL }}
      E2E_NORMAL_PASSWORD: ${{ secrets.E2E_NORMAL_PASSWORD }}
      E2E_REQUIRED_CHANGE_EMAIL: ${{ secrets.E2E_REQUIRED_CHANGE_EMAIL }}
      E2E_TEMPORARY_PASSWORD: ${{ secrets.E2E_TEMPORARY_PASSWORD }}
      E2E_FINAL_PASSWORD: ${{ secrets.E2E_FINAL_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.8.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
